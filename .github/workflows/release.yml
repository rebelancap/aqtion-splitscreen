# aqtion-splitscreen release builds (replaces upstream's build.yml, which
# builds upstream's whole matrix, nightly.yml, which publishes a rolling
# "nightly" release, and upstream's release.yml, which checks out upstream's
# repository).
#
# Push a tag v<VERSION> (e.g. v0.0.0.34; must equal the first line of
# VERSION) -> Linux x86_64 tar.gz + Windows x64 zip attached to that tag's
# GitHub release (created if missing), release notes = that version's
# section of CHANGELOG.md.  workflow_dispatch builds both archives as
# workflow artifacts only (named after VERSION, no release).
#
# Each archive holds the client and a README.txt, nothing else (unpack into
# the AQtion folder, next to q2pro / q2pro.exe; the client hosts games with
# AQtion's own action game library, so no game library is shipped):
#   linux:   q2pro-splitscreen      README.txt (LF)
#   windows: q2pro-splitscreen.exe  README.txt (CRLF; SDL2 linked in)
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - name: Tag must equal VERSION
      id: ver
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
        case "$VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::bad VERSION '$VERSION'"; exit 1 ;;
        esac
        if [ "$EVENT" = "push" ]; then
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $VERSION"
            exit 1
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "aqtion-splitscreen $VERSION"

  # Built on Ubuntu 22.04 (glibc 2.35) rather than a newer image: the client
  # links against the glibc it was built with (a Fedora 43 build needs 2.38),
  # and SteamOS 3 / older distributions ship older ones.  If GitHub retires
  # the ubuntu-22.04 image, run this job on ubuntu-24.04 with
  # "container: ubuntu:22.04" (drop sudo, add git/gcc/python3 to apt).
  # Packages: upstream's linux64 list minus avcodec / patchelf, plus the GL,
  # xkbcommon and vorbis headers.  Meson options: scripts/build.sh's
  # (upstream's Linux set minus --auto-features / --fatal-meson-warnings,
  # plus the splitscreen ones); system libraries only (nofallback).
  linux-x86_64:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y meson \
          ninja-build pkg-config libsdl2-dev libopenal-dev libpng-dev \
          libjpeg-dev zlib1g-dev mesa-common-dev libgl-dev libegl-dev \
          libcurl4-openssl-dev libx11-dev libxi-dev libxext-dev \
          libwayland-dev wayland-protocols libdecor-0-dev libxkbcommon-dev \
          libogg-dev libvorbis-dev uuid-dev libjansson-dev

    - name: Build
      run: |
        meson setup builddir --buildtype=release -Dwrap_mode=nofallback \
          -Daqtion-build=true -Dgamepad=enabled -Dsystem-wide=false \
          -Dhomedir= -Ddiscord-sdk=false -Davcodec=disabled -Dsdl2=enabled \
          -Dx11=enabled -Dwayland=enabled -Dwindows-crash-dumps=disabled \
          -Dtests=false -Dwerror=false
        meson compile -C builddir q2pro
        echo "toolchain: $(gcc --version | head -n1), meson $(meson --version), SDL2 $(pkg-config --modversion sdl2) headers, $(lsb_release -ds)"

    - name: Package
      run: |
        install -m 0755 builddir/q2pro q2pro-splitscreen
        strip q2pro-splitscreen
        # the version is in the client's banner string (meson reads VERSION)
        grep -aq "$VERSION" q2pro-splitscreen || { echo "::error::q2pro-splitscreen does not contain $VERSION"; exit 1; }
        sed "s/@VERSION@/$VERSION/g" scripts/release/README.txt > README.txt
        chmod 0644 README.txt
        tar --owner=0 --group=0 --numeric-owner -czf "aqtion-splitscreen-$VERSION-linux-x86_64.tar.gz" q2pro-splitscreen README.txt
        tar tzvf "aqtion-splitscreen-$VERSION-linux-x86_64.tar.gz"

    # Highest glibc symbol version must be <= 2.35 (Ubuntu 22.04's);
    # NEEDED is printed for the record (expect libjpeg.so.8, which Steam's
    # runtime and SteamOS have, plus SDL2, libcurl, libpng, zlib, GL/EGL,
    # Wayland, X11).
    - name: Check glibc and NEEDED
      run: |
        GLIBC_MAX="$(objdump -T q2pro-splitscreen | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
        echo "highest glibc symbol version: $GLIBC_MAX"
        [ -n "$GLIBC_MAX" ] || { echo "::error::no GLIBC_ symbol versions found"; exit 1; }
        if [ "$(printf '%s\n' "$GLIBC_MAX" GLIBC_2.35 | sort -V | tail -1)" != GLIBC_2.35 ]; then
          echo "::error::q2pro-splitscreen needs $GLIBC_MAX (> GLIBC_2.35)"
          exit 1
        fi
        readelf -d q2pro-splitscreen | grep NEEDED

    - uses: actions/upload-artifact@v7
      with:
        name: linux-x86_64
        path: aqtion-splitscreen-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
        if-no-files-found: error
        retention-days: 30

  # Upstream's msvc job (ilammy/msvc-dev-cmd, meson + ninja from pip) with
  # scripts\build.ps1's Meson options.  build.ps1 pins MSVC 2019 (14.29) on
  # the dev box; GitHub's runner has VS 2022 only, which is what upstream's
  # CI has always used, so that is fine.  forcefallback builds every library
  # from subprojects\*.wrap (hash-pinned), SDL2 (subprojects\sdl2.wrap, WrapDB)
  # statically for the gamepads only; no NASM (libjpeg-turbo is built without
  # its SIMD code, as on the dev box).  Packaging = scripts\package.ps1's:
  # q2pro.exe renamed q2pro-splitscreen.exe + README.txt, CRLF, ASCII.
  windows-x64:
    name: Windows x64 (MSVC)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install meson and ninja
      shell: pwsh
      run: python -m pip install --no-input meson ninja

    - name: Build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # pin python3 to the runner's CPython, as build.ps1 does
        $py = (Get-Command python).Source -replace '\\', '/'
        "[binaries]`npython3 = '$py'`npython = '$py'" | Out-File -Encoding ascii native.ini
        $opts = @(
          '--buildtype=release',
          '-Dwrap_mode=forcefallback',
          '-Daqtion-build=true',
          '-Ddiscord-sdk=false',
          '-Davcodec=disabled',
          '-Dsdl2=disabled',
          '-Dgamepad=enabled',
          '-Dx11=disabled',
          '-Dwayland=disabled',
          '-Dwindows-egl=true',
          '-Dtests=false',
          '-Dwerror=false'
        )
        meson setup builddir --native-file native.ini @opts
        if ($LASTEXITCODE -ne 0) { throw "meson setup failed ($LASTEXITCODE)" }
        meson compile -C builddir q2pro
        if ($LASTEXITCODE -ne 0) { throw "meson compile failed ($LASTEXITCODE)" }
        Write-Host "toolchain: MSVC $env:VCToolsVersion x64, meson $(meson --version)"

    - name: Package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $exeVersion = (Get-Item builddir\q2pro.exe).VersionInfo.ProductVersion
        if ($exeVersion -ne $env:VERSION) { throw "q2pro.exe version resource says '$exeVersion', VERSION says $env:VERSION" }
        $stage = 'pkg'
        New-Item -ItemType Directory -Path $stage | Out-Null
        Copy-Item builddir\q2pro.exe "$stage\q2pro-splitscreen.exe"
        $readme = (Get-Content -LiteralPath scripts\release\README.txt -Raw).Replace('@VERSION@', $env:VERSION)
        $readme = $readme -replace "`r?`n", "`r`n"      # CRLF for Notepad; ASCII, no BOM
        [IO.File]::WriteAllText((Join-Path (Resolve-Path $stage) 'README.txt'), $readme, (New-Object System.Text.ASCIIEncoding))
        $zip = "aqtion-splitscreen-$env:VERSION-windows-x86_64.zip"
        Compress-Archive -Path "$stage\*" -DestinationPath $zip
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
        try {
          $z.Entries | ForEach-Object { Write-Host ("  {0,10:N0}  {1}" -f $_.Length, $_.FullName) }
          if ($z.Entries.Count -ne 2) { throw "expected 2 files in $zip" }
        } finally { $z.Dispose() }

    - name: Dependencies
      shell: pwsh
      run: dumpbin /dependents builddir\q2pro.exe

    - uses: actions/upload-artifact@v7
      with:
        name: windows-x86_64
        path: aqtion-splitscreen-${{ needs.version.outputs.version }}-windows-x86_64.zip
        if-no-files-found: error
        retention-days: 30

  release:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux-x86_64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: List
      run: ls -l dist

    # Release notes = this version's section of CHANGELOG.md (between its
    # "## <VERSION> ..." heading and the next "## " heading).
    - name: Release notes from CHANGELOG.md
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        awk -v v="$VERSION" '/^## / { on = ($2 == v); next } on { print }' CHANGELOG.md > notes.md
        [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
        cat notes.md

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: aqtion-splitscreen ${{ needs.version.outputs.version }}
        body_path: notes.md
        files: |
          dist/aqtion-splitscreen-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          dist/aqtion-splitscreen-${{ needs.version.outputs.version }}-windows-x86_64.zip
        fail_on_unmatched_files: true
